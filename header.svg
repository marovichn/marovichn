<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="chess" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#000"/>
      <rect x="30" width="30" height="30" fill="#fff"/>
      <rect y="30" width="30" height="30" fill="#fff"/>
      <rect x="30" y="30" width="30" height="30" fill="#000"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Board -->
  <rect width="960" height="300" fill="#0a0a0a"/>
  <rect width="960" height="300" fill="url(#chess)" opacity="0.3"/>
  <rect width="960" height="300" fill="url(#fade)"/>

  <!-- Shapes -->
  <circle cx="885" cy="55" r="90" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="110" cy="58" r="26" fill="#fff" fill-opacity="0.07"/>
  <polygon points="40,285 100,185 160,285" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.2"/>
  <rect x="790" y="205" width="90" height="90" fill="none" stroke="#fff" stroke-opacity="0.18" transform="rotate(30 835 250)"/>
  <rect x="840" y="30" width="14" height="14" fill="#fff" fill-opacity="0.35" transform="rotate(45 847 37)"/>

  <!-- Glass card -->
  <rect x="60" y="48" width="840" height="204" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.28" filter="url(#shadow)"/>
  <path d="M84 49 H876" stroke="#fff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Text -->
  <text x="100" y="128" font-family="Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" fill="#fff">Nikola Marović</text>
  <text x="102" y="164" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#d4d4d4" letter-spacing="2">FULL-STACK WEB DEVELOPER &amp; DESIGNER</text>

  <!-- Skill pills -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">
    <rect x="102" y="190" width="90" height="34" rx="17" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
    <text x="147" y="212">React</text>
    <rect x="204" y="190" width="100" height="34" rx="17" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
    <text x="254" y="212">Next.js</text>
    <rect x="316" y="190" width="100" height="34" rx="17" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
    <text x="366" y="212">Node.js</text>
    <rect x="428" y="190" width="124" height="34" rx="17" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
    <text x="490" y="212">PostgreSQL</text>
    <rect x="564" y="190" width="90" height="34" rx="17" fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.3"/>
    <text x="609" y="212">Figma</text>
  </g>
</svg>
